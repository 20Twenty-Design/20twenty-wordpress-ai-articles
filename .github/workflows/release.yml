name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' twenty-ai-articles.php | awk '{print $NF}')
          CONST=$(grep -m1 "define( 'TAI_VERSION'" twenty-ai-articles.php | sed -E "s/.*'([0-9][^']*)'.*/\1/")
          STABLE=$(grep -m1 -E '^Stable tag:' readme.txt | awk '{print $NF}')
          echo "tag=$TAG header=$HEADER const=$CONST stable=$STABLE"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONST" ] || [ "$TAG" != "$STABLE" ]; then
            echo "::error::Version mismatch. Run bin/release.sh $TAG before tagging."
            exit 1
          fi

      - name: Lint PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build zip
        run: bin/build-zip.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/twenty-ai-articles.zip
          generate_release_notes: true
